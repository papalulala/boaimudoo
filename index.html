.meteor-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.meteor-layer img {
  position:absolute; top:var(--y); left:var(--x); width:var(--size); height:var(--size);
  object-fit:contain; opacity:0;
  animation: meteor-flight 8.6s linear var(--delay) infinite;
}
.camera-ar-open .meteor-layer { visibility:hidden; }
.camera-ar-open .meteor-layer img { animation-play-state:paused; }
@keyframes meteor-flight {
  0% { opacity:0; transform:translate(0,0) rotate(-12deg); }
  4% { opacity:.9; }
  13% { opacity:.9; }
  20%,100% { opacity:0; transform:translate(-24vw,11vh) rotate(14deg); }
}
@media (max-width:600px) {
  .meteor-layer img { max-width:28px; max-height:28px; }
  .meteor-layer img:nth-child(even) { display:none; }
}
@media (prefers-reduced-motion:reduce) { .meteor-layer { display:none; } }
