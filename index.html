<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>博愛木都</title><link rel="stylesheet" href="style.css?v=29"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><style>
.meteor-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.meteor-layer img {
  position:absolute; top:var(--y); left:var(--x); width:var(--size); height:var(--size);
  object-fit:contain; opacity:0;
  animation: meteor-flight 8.6s linear var(--delay) infinite;
}
.camera-ar-open .meteor-layer { visibility:hidden; }
.camera-ar-open .meteor-layer img { animation-play-state:paused; }
@keyframes meteor-flight {
  0% { opacity:0; transform:translate(0,0) rotate(-12deg); }
  4% { opacity:.9; }
  13% { opacity:.9; }
  20%,100% { opacity:0; transform:translate(-24vw,11vh) rotate(14deg); }
}
@media (max-width:600px) {
  .meteor-layer img { max-width:28px; max-height:28px; }
  .meteor-layer img:nth-child(2), .meteor-layer img:nth-child(7), .meteor-layer img:nth-child(9) { display:none; } .meteor-layer img:nth-child(8), .meteor-layer img:nth-child(11) { max-width:44px; max-height:44px; }
}
@media (prefers-reduced-motion:reduce) { .meteor-layer { display:none; } }
</style><style>.corner-forest{position:absolute;right:0;bottom:0;width:min(43.5vw,540px,67.5vh);height:auto;pointer-events:none}.camera-ar-open .corner-forest{visibility:hidden}@media(max-width:600px){.corner-forest{width:min(28vw,135px)}}</style><style>.corner-forest-left{position:absolute;left:0;bottom:0;width:min(58vw,720px,90vh);height:auto;pointer-events:none}.camera-ar-open .corner-forest-left{visibility:hidden}@media(max-width:600px){.corner-forest-left{width:min(28vw,135px)}}</style><style>.lettering img{filter:invert(1) brightness(calc(1 - var(--lettering-white,0))) invert(1);}</style><style>
.fireflies{position:absolute;bottom:0;pointer-events:none;opacity:var(--lettering-white,0)}
.fireflies-left{left:0;width:min(58vw,720px,90vh);aspect-ratio:1994/796}
.fireflies-right{right:0;width:min(43.5vw,540px,67.5vh);aspect-ratio:1547/794}
.fireflies i{position:absolute;left:var(--x);top:var(--y);width:var(--size);aspect-ratio:1;border-radius:50%;background:#ffe86b;box-shadow:0 0 7px #ffc83b;animation:firefly var(--speed) ease-in-out var(--delay) infinite alternate}
@keyframes firefly{
  0%{transform:translate(0,0);opacity:.25}
  42%{transform:translate(var(--dx),-13px);opacity:1}
  75%{opacity:.45}
  100%{transform:translate(calc(var(--dx) * -.65),8px);opacity:.85}
}
.camera-ar-open .fireflies,.camera-ar-open .fireflies i{visibility:hidden;animation-play-state:paused}
@media(max-width:600px){.fireflies{width:min(28vw,135px)}.fireflies i{max-width:4px}}
@media(prefers-reduced-motion:reduce){.fireflies{display:none}}
