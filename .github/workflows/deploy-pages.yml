name: Deploy campus with animated AR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build site and assemble animated USDZ
        run: |
          mkdir _site
          cp index.html app.js style.css campus.glb title-art.png story-art.png enter-site.png _site/
          cat campus-ar-1.bin campus-ar-2.bin campus-ar-3.bin campus-ar-4.bin campus-ar-5.bin > _site/campus-animated.usdz
          echo '4225baa265e8392495be7cea9c9d061e9a7c09ca0e044874700846b14fcf4d3d  _site/campus-animated.usdz' | sha256sum -c -
          python -m zipfile -t _site/campus-animated.usdz
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
