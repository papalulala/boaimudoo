name: Deploy campus WebAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build camera AR site
        run: |
          mkdir _site
          cp index.html app.js ar-camera.js style.css campus.glb title-art.png story-art.png enter-site.png _site/
          node --check _site/app.js
          node --check _site/ar-camera.js
          test -s _site/campus.glb
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
